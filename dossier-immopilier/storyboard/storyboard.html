<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Immopilier — conducteur vidéo 67,5 s</title>
<style>
  /* Polices du site, chargées depuis le dossier voisin : la planche reste lisible
     hors ligne, sans dépendre de Google Fonts. */
  @font-face{font-family:'Geist';font-weight:400;src:url('../marque/polices/Geist-400.ttf') format('truetype')}
  @font-face{font-family:'Geist';font-weight:500;src:url('../marque/polices/Geist-500.ttf') format('truetype')}
  @font-face{font-family:'Geist';font-weight:600;src:url('../marque/polices/Geist-600.ttf') format('truetype')}
  @font-face{font-family:'Geist Mono';font-weight:400;src:url('../marque/polices/GeistMono-400.ttf') format('truetype')}

  :root{
    --bg:#ffffff; --bg-subtle:#f6f6f8; --surface:#ffffff;
    --ink:#121216; --ink-2:#4d4d57; --ink-3:#6a6a75;
    --line:#e5e5e9; --accent:#2e4fe6; --accent-50:#eef1ff; --accent-200:#b9c6ff;
    --dark:#0a0a0c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg-subtle);color:var(--ink);
       font-family:'Geist',system-ui,sans-serif;font-size:14px;line-height:1.55}
  .wrap{max-width:1120px;margin:0 auto;padding:40px 24px 80px}

  header{margin-bottom:32px}
  h1{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:0 0 6px}
  .sub{color:var(--ink-2);font-size:15px;margin:0}
  .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;
        padding:4px 12px;font-size:12px;color:var(--ink-2)}
  .chip b{color:var(--ink);font-weight:600}

  /* Frise proportionnelle : chaque plan occupe sa durée réelle. */
  .frise{display:flex;height:56px;border-radius:10px;overflow:hidden;border:1px solid var(--line);
         background:var(--surface);margin:24px 0 8px}
  .frise i{position:relative;display:block;border-right:1px solid var(--line);font-style:normal}
  .frise i:last-child{border-right:0}
  .frise i span{position:absolute;inset:auto 0 4px 0;text-align:center;font-size:10px;color:var(--ink-3)}
  .frise i.clair{background:#fff}
  .frise i.sombre{background:var(--dark)}
  .frise i.sombre span{color:#8b8b96}
  .actes{display:flex;font-size:11px;color:var(--ink-3);margin-bottom:36px}
  .actes b{font-weight:500;color:var(--ink-2);border-left:1px solid var(--line);padding-left:6px}

  .plan{background:var(--surface);border:1px solid var(--line);border-radius:14px;
        padding:20px 22px;margin-bottom:14px;display:grid;
        grid-template-columns:104px minmax(0,1fr) minmax(0,260px);gap:22px;align-items:start}
  .plan.sombre{background:var(--dark);border-color:#26262c;color:#f6f6f8}
  .plan.sombre .tc,.plan.sombre .lab{color:#8b8b96}
  .plan.sombre .txt{color:#b3b3bc}
  .plan.sombre .ecran{background:#17171c;border-color:#26262c}

  .num{font-size:12px;font-weight:600;color:var(--accent)}
  .tc{font-family:'Geist Mono',monospace;font-size:12px;color:var(--ink-3);margin-top:2px}
  .duree{font-size:11px;color:var(--ink-3);margin-top:8px}
  h2{font-size:16px;font-weight:600;letter-spacing:-.01em;margin:0 0 6px}
  .txt{color:var(--ink-2);margin:0 0 10px}
  .lab{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
       font-weight:500;margin:12px 0 4px}
  .ecran{background:var(--bg-subtle);border:1px solid var(--line);border-radius:10px;
         padding:12px 14px;font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
  .ecran em{font-style:normal;color:var(--accent)}
  .plan.sombre .ecran em{color:#6e88f7}
  .vo{font-size:14px;color:var(--ink-2);border-left:2px solid var(--accent-200);padding-left:12px}
  .plan.sombre .vo{border-left-color:#2340bd;color:#b3b3bc}
  .muet{font-size:13px;color:var(--ink-3);font-style:italic}

  @media (max-width:820px){ .plan{grid-template-columns:1fr} .frise{height:40px} }
  @media print{ body{background:#fff} .plan{break-inside:avoid} }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Conducteur vidéo — Immopilier</h1>
  <p class="sub">« Géolocalise, analyse, décide » — 24 plans, calés sur le découpage du film de référence.</p>
  <div class="meta">
    <span class="chip">Durée <b>67,5 s</b></span>
    <span class="chip">Format <b>1920 × 1080</b></span>
    <span class="chip">Cadence <b>60 fps</b></span>
    <span class="chip">Voix off <b>188 mots</b></span>
    <span class="chip">Police <b>Geist</b></span>
    <span class="chip">Accent <b>#2e4fe6</b></span>
  </div>
</header>

<div class="frise" id="frise"></div>
<div class="actes" id="actes"></div>

<div id="plans"></div>

</div>
<script>
/* Le conducteur, en données : la frise et les fiches sortent de la même source,
   impossible qu'elles se contredisent. Les bornes sont celles du script. */
const PLANS = [
  [0,2.40,'clair','Radar sur la carte de France','Balayage bleu depuis le centre ; les ventes publiées s\'allument une à une.','','Une annonce qui te plaît.'],
  [2.40,4.60,'clair','La boussole qui ne se fixe pas','L\'aiguille tourne sans trouver le nord. Typo cinétique en haut de cadre.','tu cherchais l\'adresse <em>à la main</em> ?','Et toi, tu cherchais l\'adresse à la main ?'],
  [4.60,6.20,'clair','Mise en pause','Le plan précédent se réduit dans une fenêtre de navigateur et se fige.','','—'],
  [6.20,8.50,'sombre','Le constat','Noir, halo bleu au ras du bord bas. Deux lignes qui se succèdent.','Parce qu\'une annonce ne dit jamais<br>où elle <em>est</em>','Parce qu\'une annonce ne dit jamais où elle est.'],
  [8.50,12.50,'sombre','Les cinq étapes, à la main','Chemin sinueux et cinq jalons : trouver l\'adresse, situer la parcelle, comparer les ventes, lire le quartier, décider.','1 · 2 · 3 · 4 · 5','Trouver l\'adresse. Situer la parcelle. Comparer les ventes réelles. Lire le quartier. Décider.'],
  [12.50,15.82,'sombre','Le mur d\'annonces','Des vignettes fictives s\'empilent en perspective jusqu\'à saturer le cadre.','','Multiplie ça par vingt annonces dans la semaine.'],
  [15.82,18.12,'sombre','Le dossier vide','Un grand dossier bleu s\'ouvre : rien dedans. Deux mouches en sortent.','et tu n\'as toujours <em>aucun repère</em>','Et tu n\'as toujours aucun repère de prix.'],
  [18.12,22.40,'clair','La marque, puis le lien collé','Bascule au blanc. L\'épingle apparaît dans un halo, le mot se déplie, une URL se colle dans le champ.','✓ adresse trouvée','Immopilier. Tu colles le lien de l\'annonce.'],
  [22.40,26.80,'clair','Zoom jusqu\'à la parcelle','La carte descend du plan commune au plan parcelle ; l\'encart adresse glisse par le bas.','<em>Simple,</em> ✓ non ?','Il te rend l\'adresse exacte, sur la carte, à la parcelle. Simple, non ?'],
  [26.80,28.18,'sombre','Trois tuiles','Prix médian, ventes retenues, écart au quartier : les chiffres montent en compteur.','1 854 €/m² · 162 ventes · −6 %','—'],
  [28.18,31.18,'sombre','La carte des prix en relief','Les mailles de 200 m s\'extrudent quand la caméra s\'incline à 55°.','Prix au m² — médiane par maille de 200 m · 2020–2024','Le prix au m², rue par rue, sur les ventes réellement signées.'],
  [31.18,32.78,'sombre','La fiche se déroule','Défilement rapide de toute la fiche adresse, puis arrêt net.','','Et l\'adresse, elle, raconte tout le reste.'],
  [32.78,35.28,'sombre','Quatre blocs au premier plan','Parcelle, bâtiment, étiquette DPE, risques et PLU se présentent l\'un après l\'autre.','A B C D E F G','La parcelle, le bâtiment, le DPE, les risques, le règlement d\'urbanisme.'],
  [35.28,38.37,'sombre','Les compteurs','Ventes analysées, communes couvertes, millésimes : trois nombres qui s\'incrémentent.','1 284 · 34 935 · 2020 → 2024','Tout vient des bases publiques de l\'État. Rien n\'est estimé.'],
  [38.37,41.00,'clair','La couronne des communes','Les communes voisines tournent autour du point central, chacune avec son prix au m².','','Les communes autour, comparées au même mètre carré.'],
  [41.00,43.50,'clair','L\'entonnoir','Quarante vignettes entrent, trois ressortent ; les recalées se dissolvent.','<em>40</em> → <em>3</em>','De quarante annonces, il t\'en reste trois.'],
  [43.50,46.53,'clair','Le face-à-face','Deux biens côte à côte dans une fenêtre : un ✗ rouge, un ✓ bleu.','2 707 €/m² · −6 %  |  3 210 €/m² · +12 %','Celle qui est sous le prix du quartier. Et celle qui ne l\'est pas.'],
  [46.53,48.00,'sombre','La fiche récapitulative','Une seule carte au centre : surface, prix, prix au m², médiane, écart.','','—'],
  [48.00,50.93,'sombre','L\'agent répond','Deux bulles : la question en bleu, la réponse qui s\'écrit mot à mot.','« Ce bien est-il au bon prix ? »','Demande-lui ce que tu veux : il répond avec les chiffres de la commune.'],
  [50.93,53.00,'sombre','La France s\'allume','Dézoom continu ; les points de vente s\'agglomèrent en constellation.','','—'],
  [53.00,56.50,'sombre','Les trois nombres','6 bases publiques, 5 millésimes, 34 935 communes, avec la ligne des sources dessous.','DVF · Cadastre · BAN · IGN · INSEE · ADEME','Six bases publiques. Cinq millésimes de ventes. Toute la France.'],
  [56.50,61.00,'sombre','La punchline','Typographie seule sur le halo bleu, en trois temps.','des décisions prises sur <em>des faits</em><br>pas sur une <em>impression</em>.','Des décisions prises sur des faits. Pas sur une impression.'],
  [61.00,64.00,'clair','L\'appel','Retour au blanc, arcs bleu pâle en haut et en bas. Trois temps de texte.','<em>Colle</em> ta première annonce<br>et vois où elle est <em>vraiment</em>.','Colle ta première annonce, et vois où elle est vraiment.'],
  [64.00,67.50,'clair','La signature','Logo Immopilier, bouton bleu, curseur qui clique à 66,4 s, fondu au blanc.','Géolocaliser une annonce','—']
];

const TOTAL = 67.5;
const frise = document.getElementById('frise');
PLANS.forEach(([d, f, fond], i) => {
  const el = document.createElement('i');
  el.className = fond;
  el.style.flex = (f - d) + ' 0 0';
  el.innerHTML = '<span>' + (i + 1) + '</span>';
  el.title = 'Plan ' + (i + 1) + ' — ' + (f - d).toFixed(1) + ' s';
  frise.appendChild(el);
});

const ACTES = [['I. L\'accroche', 0, 8.5], ['II. Le coût du flou', 8.5, 18.12],
               ['III. Le produit', 18.12, 50.93], ['IV. La preuve', 50.93, 61],
               ['V. L\'appel', 61, 67.5]];
document.getElementById('actes').innerHTML = ACTES.map(([nom, d, f]) =>
  '<b style="flex:' + (f - d) + ' 0 0">' + nom + '</b>').join('');

const tc = (s) => String(Math.floor(s / 60)).padStart(2, '0') + ':' +
                  String(Math.floor(s % 60)).padStart(2, '0') + ',' +
                  String(Math.round((s % 1) * 100)).padStart(2, '0');

document.getElementById('plans').innerHTML = PLANS.map(([d, f, fond, titre, image, ecran, vo], i) => `
  <article class="plan ${fond === 'sombre' ? 'sombre' : ''}">
    <div>
      <div class="num">PLAN ${String(i + 1).padStart(2, '0')}</div>
      <div class="tc">${tc(d)} → ${tc(f)}</div>
      <div class="duree">${(f - d).toFixed(1).replace('.', ',')} s · fond ${fond}</div>
    </div>
    <div>
      <h2>${titre}</h2>
      <p class="txt">${image}</p>
      ${ecran ? `<div class="lab">Texte à l'écran</div><div class="ecran">${ecran}</div>` : ''}
    </div>
    <div>
      <div class="lab">Voix off</div>
      ${vo === '—' ? '<p class="muet">Silence — le son porte le plan.</p>' : `<p class="vo">${vo}</p>`}
    </div>
  </article>`).join('');
</script>
</body>
</html>
